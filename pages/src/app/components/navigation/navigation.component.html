<nav class="navbar navbar-top" id="navbar" [class.post-open]="postState.navPostOpen() || projectState.navProjectOpen()" [class.navbar-hidden]="!navbarRevealed" [class.navbar-revealing]="navbarRevealing">
  @if (isDetailOpen) {
    <button class="navbar-back-btn" (click)="closeActive()" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
  } @else {
    <a class="navbar-brand mx-3" href="#">
      <span class="brand-slash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="7" y1="20" x2="17" y2="4"/>
        </svg>
      </span>vaverkaj</a>
  }

  <!-- desktop: links + toggle — hidden when post/project is open -->
  <div class="d-none d-md-flex ms-auto align-items-center me-3" [class.nav-links-hidden]="isDetailOpen">
    <ul class="navbar-nav flex-row align-items-center mb-0">
      <li class="nav-item"><a class="nav-link" (click)="scrollTo('about')">About</a></li>
      <li class="nav-item"><a class="nav-link" (click)="scrollTo('experience')">Experience</a></li>
      <li class="nav-item"><a class="nav-link" (click)="scrollTo('posts')">Posts</a></li>
      <li class="nav-item"><a class="nav-link" (click)="scrollTo('work')">Work</a></li>
      <li class="nav-item"><a class="nav-link" (click)="scrollTo('contact')">Contact</a></li>
      <li class="nav-item">
        <a class="button" href="assets/CV_Jakub_Vaverka.pdf" download>Resume</a>
      </li>
    </ul>

    <button
      class="theme-switch"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="themeService.isDark()"
    >
      <span class="theme-switch__track" [class.on]="themeService.isDark()">
        <span class="theme-switch__thumb">
          @if (themeService.isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="none"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
              <line x1="12" y1="2" x2="12" y2="5.5"/>
              <line x1="12" y1="18.5" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="5.5" y2="12"/>
              <line x1="18.5" y1="12" x2="22" y2="12"/>
              <line x1="4.93" y1="4.93" x2="7.28" y2="7.28"/>
              <line x1="16.72" y1="16.72" x2="19.07" y2="19.07"/>
              <line x1="4.93" y1="19.07" x2="7.28" y2="16.72"/>
              <line x1="16.72" y1="7.28" x2="19.07" y2="4.93"/>
            </svg>
          }
        </span>
      </span>
    </button>
  </div>
</nav>

<!-- mobile hamburger — hidden when post/project is open -->
<div id="cross" class="d-flex d-md-none" [class.navbar-hidden]="!navbarRevealed" [class.navbar-revealing]="navbarRevealing" [class.d-none]="isDetailOpen">
  <svg
    class="ham hamRotate ham8"
    [class.active]="isSideMenuOpen"
    viewBox="0 0 100 100"
    width="70"
    (click)="isSideMenuOpen = !isSideMenuOpen"
    role="button"
    [attr.aria-label]="isSideMenuOpen ? 'Close menu' : 'Open menu'"
    [attr.aria-expanded]="isSideMenuOpen"
  >
    <path class="line top" d="m 30,33 h 40 c 3.722839,0 7.5,3.126468 7.5,8.578427 0,5.451959 -2.727029,8.421573 -7.5,8.421573 h -20"/>
    <path class="line middle" d="m 30,50 h 40"/>
    <path class="line bottom" d="m 70,67 h -40 c 0,0 -7.5,-0.802118 -7.5,-8.365747 0,-7.563629 7.5,-8.634253 7.5,-8.634253 h 20"/>
  </svg>
</div>

<!-- sidemenu — hidden when post/project is open -->
<div
  [class.active]="isSideMenuOpen"
  [class.d-none]="isDetailOpen"
  class="nav-sidemenu d-md-none d-flex align-items-center justify-content-center"
>
  <ul class="navbar-nav flex-column align-items-center w-100">
    <li class="nav-item m-3"><a class="nav-link" (click)="scrollTo('about')">About</a></li>
    <li class="nav-item m-3"><a class="nav-link" (click)="scrollTo('experience')">Experience</a></li>
    <li class="nav-item m-3"><a class="nav-link" (click)="scrollTo('posts')">Posts</a></li>
    <li class="nav-item m-3"><a class="nav-link" (click)="scrollTo('work')">Work</a></li>
    <li class="nav-item m-3"><a class="nav-link" (click)="scrollTo('contact')">Contact</a></li>
    <li class="nav-item m-3">
      <a class="button" href="assets/CV_Jakub_Vaverka.pdf" download>Resume</a>
    </li>
    <li class="nav-item mt-4">
      <button
        class="theme-switch"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <span class="theme-switch__track" [class.on]="themeService.isDark()">
          <span class="theme-switch__thumb">
            @if (themeService.isDark()) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="none"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
                <line x1="12" y1="2" x2="12" y2="5.5"/>
                <line x1="12" y1="18.5" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5.5" y2="12"/>
                <line x1="18.5" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="4.93" x2="7.28" y2="7.28"/>
                <line x1="16.72" y1="16.72" x2="19.07" y2="19.07"/>
                <line x1="4.93" y1="19.07" x2="7.28" y2="16.72"/>
                <line x1="16.72" y1="7.28" x2="19.07" y2="4.93"/>
              </svg>
            }
          </span>
        </span>
      </button>
    </li>
  </ul>
</div>
