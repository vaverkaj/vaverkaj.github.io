<nav @load1 class="navbar navbar-top" id="navbar">
  <a class="navbar-brand mx-3" href="#">\vaverkaj</a>

  <!-- desktop: links + theme toggle -->
  <div class="d-none d-md-flex ms-auto align-items-center me-2">
    <ul class="navbar-nav flex-row align-items-center mb-0">
      <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
      <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
      <li class="nav-item"><a class="nav-link" href="#posts">Posts</a></li>
      <li class="nav-item"><a class="nav-link" href="#work">Work</a></li>
      <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      <li class="nav-item">
        <a class="button" href="assets/CV_Jakub_Vaverka.pdf" download>Resume</a>
      </li>
    </ul>
    <button
      class="theme-toggle ms-1"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (themeService.isDark()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.71.71M6.34 17.66l-.71.71M17.66 17.66l-.71-.71M6.34 6.34l-.71-.71M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </div>
</nav>

<!-- mobile hamburger — fixed outside the navbar so it stays visible while scrolling -->
<div @load1 id="cross" class="d-flex d-md-none">
  <svg
    class="ham hamRotate ham8"
    [class.active]="isSideMenuOpen"
    viewBox="0 0 100 100"
    width="70"
    (click)="isSideMenuOpen = !isSideMenuOpen"
    role="button"
    [attr.aria-label]="isSideMenuOpen ? 'Close menu' : 'Open menu'"
    [attr.aria-expanded]="isSideMenuOpen"
  >
    <path class="line top" d="m 30,33 h 40 c 3.722839,0 7.5,3.126468 7.5,8.578427 0,5.451959 -2.727029,8.421573 -7.5,8.421573 h -20"/>
    <path class="line middle" d="m 30,50 h 40"/>
    <path class="line bottom" d="m 70,67 h -40 c 0,0 -7.5,-0.802118 -7.5,-8.365747 0,-7.563629 7.5,-8.634253 7.5,-8.634253 h 20"/>
  </svg>
</div>

<!-- sidemenu — mobile only, hidden on md+ -->
<div [class.active]="isSideMenuOpen" class="nav-sidemenu h-100 w-50 d-md-none d-flex align-self-center">
  <ul class="navbar-nav flex-column align-items-center align-self-center w-100">
    <li class="nav-item m-3"><a class="nav-link" href="#about" (click)="isSideMenuOpen = false">About</a></li>
    <li class="nav-item m-3"><a class="nav-link" href="#experience" (click)="isSideMenuOpen = false">Experience</a></li>
    <li class="nav-item m-3"><a class="nav-link" href="#posts" (click)="isSideMenuOpen = false">Posts</a></li>
    <li class="nav-item m-3"><a class="nav-link" href="#work" (click)="isSideMenuOpen = false">Work</a></li>
    <li class="nav-item m-3"><a class="nav-link" href="#contact" (click)="isSideMenuOpen = false">Contact</a></li>
    <li class="nav-item m-3">
      <a class="button" href="assets/CV_Jakub_Vaverka.pdf" download>Resume</a>
    </li>
    <li class="nav-item m-3">
      <button
        class="theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.isDark()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.71.71M6.34 17.66l-.71.71M17.66 17.66l-.71-.71M6.34 6.34l-.71-.71M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>
    </li>
  </ul>
</div>
