<div class="post-page" role="main" style="view-transition-name: active-post-card">
  <div class="post-page__content">
    <h1 class="post-title" style="view-transition-name: active-post-title">{{ postState.activePost()?.title }}</h1>
    @if (postState.activePost()?.date) {
      <p class="post-date" style="view-transition-name: active-post-date">{{ postState.activePost()?.date }}</p>
    }
    @if (loading()) {
      <p class="loading">Loading…</p>
    } @else {
      <div class="post-body" [innerHTML]="html()"></div>
    }
  </div>
</div>
