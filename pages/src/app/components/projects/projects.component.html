<div class="row d-flex justify-content-center">
  <div class="col-12">
    <h3>Some Things I've Built</h3>
    <div class="projects-grid">
      @for (project of projects; track project.title) {
        @let t = projectState.transitioningProject()?.title === project.title;
        <article
          class="project-card"
          (click)="open(project)"
          role="button"
          tabindex="0"
          (keydown.enter)="open(project)"
          (keydown.space)="open(project); $event.preventDefault()"
          [style.viewTransitionName]="t ? 'active-project-card' : null"
        >
          <div class="project-card__image-wrap"
               [style.viewTransitionName]="t ? 'active-project-image' : null">
            <img [src]="project.imageUrl" [alt]="project.title + ' screenshot'" class="project-card__image" loading="lazy" />
          </div>
          <div class="project-card__body">
            <p class="project-card__type"
               [style.viewTransitionName]="t ? 'active-project-type' : null">{{ project.type }}</p>
            <h4 class="project-card__title"
                [style.viewTransitionName]="t ? 'active-project-title' : null">
              {{ project.title }}
            </h4>
            <p class="project-card__desc"
               [style.viewTransitionName]="t ? 'active-project-desc' : null">{{ project.description }}</p>
            <div class="project-card__tech"
                 [style.viewTransitionName]="t ? 'active-project-tech' : null">
              @for (tech of project.technologies; track tech) {
                <span class="chip">{{ tech }}</span>
              }
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</div>
